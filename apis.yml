aid: southendonsea
name: SouthendOnSea.city
description: >-
  SouthendOnSea.city is an independent local information and community-participation platform for
  Southend-on-Sea, Essex, covering local news, community propositions and public voting, city
  information and the Southend Science Exhibition. Its public data API — Southend Now — serves
  unauthenticated, source-linked current and historical observations for the area: weather,
  designated bathing waters, marine conditions, modelled air quality and flood alerts. Three
  operations return the current snapshot, a JSON history and a CSV history, refreshed on a
  1,800-second interval, with source licensing and attribution preserved in the payload. The
  platform is independent and unofficial and states plainly that it is not operated by
  Southend-on-Sea City Council, Essex Police or any election authority.
