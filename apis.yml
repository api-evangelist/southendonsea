  note: >-
    Submitted via apis.io/add on 2026-08-23 from hello@southendonsea.city and rated 71 (exemplar)
    by the gate — the highest-rated submission seen in this sweep, and it holds up.
    Unusually, the submitted APIs.json URL is CORRECT. It resolves at both
    /.well-known/apis.json and /apis.json, an invented control path returns a real 404, and every
    property it declares was fetched and confirmed. The OpenAPI is served as
    application/vnd.oai.openapi+json;version=3.0 — the correct media type, which almost no
    provider sets.
    The API was exercised anonymously: GET /api/southend-now returned live observations with real
    beach records, a licence note and a generatedAt timestamp, and the CSV history endpoint
    returned text/csv. No key, no signup.
    ONE THING RECORDED CAREFULLY. This is NOT a council or government API and must not be
    presented as one. The operator states on its own llms.txt that it is "independent and
    unofficial, and is not operated by Southend-on-Sea City Council, Essex Police or an election
    authority", and that its articles reorganise official Essex Police and council updates. The
    data is source-linked to official publishers; the platform is a third party republishing it.
